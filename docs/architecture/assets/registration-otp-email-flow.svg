<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1580" viewBox="0 0 1200 1580">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#214780"/>
</marker>
</defs>
<rect width="100%" height="100%" fill="white"/>
<text x="600.0" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#111827">Flujo objetivo de registro ETB</text>
<text x="600.0" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#111827">con OTP por correo</text>
<rect x="330" y="125" width="540" height="82" rx="16" fill="#f8fbff" stroke="#214780" stroke-width="3"/>
<text x="600.0" y="159.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">1. Usuario</text>
<text x="600.0" y="189.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">Ingresa datos Hogares/MiPymes</text>
<line x1="600" y1="207" x2="600" y2="241" stroke="#214780" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="330" y="241" width="540" height="82" rx="16" fill="#eef7f9" stroke="#0092bc" stroke-width="3"/>
<text x="600.0" y="275.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">2. IdP SPA</text>
<text x="600.0" y="305.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">Llama /api/customer/lookup</text>
<line x1="600" y1="323" x2="600" y2="357" stroke="#214780" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="330" y="357" width="540" height="82" rx="16" fill="#f8fbff" stroke="#214780" stroke-width="3"/>
<text x="600.0" y="391.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">3. BFF Cloud Run</text>
<text x="600.0" y="421.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">Valida origen, riesgo y datos</text>
<line x1="600" y1="439" x2="600" y2="473" stroke="#214780" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="330" y="473" width="540" height="82" rx="16" fill="#f8fbff" stroke="#214780" stroke-width="3"/>
<text x="600.0" y="507.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">4. MS-1 o mock</text>
<text x="600.0" y="537.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">Obtiene cliente + correo ETB</text>
<line x1="600" y1="555" x2="600" y2="589" stroke="#214780" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="330" y="589" width="540" height="82" rx="16" fill="#eef7f9" stroke="#0092bc" stroke-width="3"/>
<text x="600.0" y="623.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">5. IdP SPA</text>
<text x="600.0" y="653.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">Recibe sessionId + correo enmascarado</text>
<line x1="600" y1="671" x2="600" y2="705" stroke="#214780" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="330" y="705" width="540" height="82" rx="16" fill="#fff7ed" stroke="#d86055" stroke-width="3"/>
<text x="600.0" y="739.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">6. OTP por EMAIL</text>
<text x="600.0" y="769.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">Objetivo pendiente; mock en pruebas</text>
<line x1="600" y1="787" x2="600" y2="821" stroke="#214780" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="330" y="821" width="540" height="82" rx="16" fill="#fff7ed" stroke="#d86055" stroke-width="3"/>
<text x="600.0" y="855.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">7. /otp/validate</text>
<text x="600.0" y="885.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">Canal real pendiente o mock</text>
<line x1="600" y1="903" x2="600" y2="937" stroke="#214780" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="330" y="937" width="540" height="82" rx="16" fill="#eef7f9" stroke="#0092bc" stroke-width="3"/>
<text x="600.0" y="971.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">8. /customers/register</text>
<text x="600.0" y="1001.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">Password, telefono y terminos</text>
<line x1="600" y1="1019" x2="600" y2="1053" stroke="#214780" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="330" y="1053" width="540" height="82" rx="16" fill="#fff7ed" stroke="#d86055" stroke-width="3"/>
<text x="600.0" y="1087.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">9. MS-4 opcional</text>
<text x="600.0" y="1117.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">Solo con configuracion productiva</text>
<line x1="600" y1="1135" x2="600" y2="1169" stroke="#214780" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="330" y="1169" width="540" height="82" rx="16" fill="#f8fbff" stroke="#214780" stroke-width="3"/>
<text x="600.0" y="1203.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">10. Firebase Admin SDK</text>
<text x="600.0" y="1233.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">Usuario + claims + customToken</text>
<line x1="600" y1="1251" x2="600" y2="1285" stroke="#214780" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="330" y="1285" width="540" height="82" rx="16" fill="#f8fbff" stroke="#214780" stroke-width="3"/>
<text x="600.0" y="1319.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">11. Identity Platform</text>
<text x="600.0" y="1349.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">signInWithCustomToken + id_token</text>
<line x1="600" y1="1367" x2="600" y2="1401" stroke="#214780" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="330" y="1401" width="540" height="82" rx="16" fill="#eef7f9" stroke="#0092bc" stroke-width="3"/>
<text x="600.0" y="1435.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">12. Cliente OIDC</text>
<text x="600.0" y="1465.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">Retorno redirect_uri#id_token</text>
<text x="600.0" y="1527" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#d86055">Nota: OTP por correo es deseable, pero pendiente de confirmar e integrar.</text>
</svg>