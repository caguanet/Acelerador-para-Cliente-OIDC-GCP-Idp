<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Client - OIDC Test</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f0f2f5; }
        .container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .btn { background-color: #4285F4; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; margin-top: 20px; }
        .btn:hover { background-color: #357ae8; }
        .token-box { background: #f8f9fa; border: 1px solid #dee2e6; padding: 10px; border-radius: 4px; overflow-wrap: break-word; font-family: monospace; font-size: 12px; text-align: left; margin-top: 20px; max-height: 200px; overflow-y: auto; }
        h1 { color: #333; }
        p { color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mock Client App</h1>
        <p>Simulation of a Partner App (Port 3000)</p>
        
        <div id="login-section">
            <button id="login-btn" class="btn">Login with Identity Provider</button>
        </div>

        <div id="token-section" style="display: none;">
            <h3>✅ Authenticated</h3>
            <p>ID Token received via OIDC:</p>
            <div id="token-display" class="token-box"></div>
            <button id="logout-btn" class="btn" style="background-color: #dc3545;">Logout (Local)</button>
        </div>
    </div>

    <script src="/config.js"></script>
    <script>
        // Dynamic Config with Local Fallback
        const CONFIG = window.APP_CONFIG || {};
        
        const IDP_URL = CONFIG.IDP_URL || 'http://localhost:5173';
        const CLIENT_ID = 'mock-client-app';
        // If deployed, REDIRECT_URI should be the current page
        const REDIRECT_URI = CONFIG.MOCK_CLIENT_URL || window.location.origin; 

        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const tokenSection = document.getElementById('token-section');
        const loginSection = document.getElementById('login-section');
        const tokenDisplay = document.getElementById('token-display');

        // Check for Token in Hash (OIDC Callback)
        function checkHash() {
            const hash = window.location.hash;
            if (hash && hash.includes('id_token=')) {
                const token = hash.split('id_token=')[1].split('&')[0];
                showToken(token);
                // Clean URL
                window.history.replaceState(null, '', window.location.pathname);
            }
        }

        function showToken(token) {
            tokenDisplay.textContent = token;
            loginSection.style.display = 'none';
            tokenSection.style.display = 'block';
            sessionStorage.setItem('mock_token', token);
        }

        function logout() {
            sessionStorage.removeItem('mock_token');
            location.reload();
        }

        // Check Session
        const storedToken = sessionStorage.getItem('mock_token');
        if (storedToken) {
            showToken(storedToken);
        } else {
            checkHash();
        }

        loginBtn.addEventListener('click', () => {
            // Initiate OIDC Implicit Flow
            const authUrl = `${IDP_URL}/?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&state=random_state_string`;
            window.location.href = authUrl;
        });

        logoutBtn.addEventListener('click', logout);
    </script>
</body>
</html>
